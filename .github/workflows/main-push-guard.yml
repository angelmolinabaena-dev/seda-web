name: Main push guard

# Detective, not preventive. This repo is private on the GitHub Free
# plan, which doesn't offer branch protection (or rulesets — same
# boundary) on private repos; that needs Pro/Team/Enterprise. There is
# no server-side gate stopping a direct `git push origin main` today.
#
# .githooks/pre-push blocks that client-side, but it structurally
# can't see two things: a PR merge (`gh pr merge` / the "Merge pull
# request" button are API calls — no hook involved) and a push from a
# clone that never ran `npm install` (the hook never got wired up via
# scripts/setup-hooks.mjs). This workflow is the after-the-fact net
# for both.
#
# On every push to `main`, ask GitHub whether the landed commit is
# associated with a pull request (the "list pull requests associated
# with a commit" endpoint — a squash-merge from `gh pr merge --squash`
# DOES show up here, so this signal is reliable). If the list comes
# back empty, the commit reached `main` without going through a PR —
# open an issue with the details. If a PR is found, do nothing at all:
# this runs on every legitimate merge too, and a legitimate merge
# should be silent.
#
# This workflow never fails on purpose — a red check on `main` that
# nobody reads isn't the point; the issue is the point.

on:
  push:
    branches: [main]

permissions:
  issues: write
  contents: read
  pull-requests: read

jobs:
  detect-direct-push:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check whether this push is associated with a PR
        id: pr-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          count=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq 'length')
          echo "Associated PRs for $SHA: $count"
          echo "pr_count=$count" >> "$GITHUB_OUTPUT"

      # Dedupe: if this exact sha already got an issue (e.g. the
      # workflow re-runs, or the same push somehow triggers twice),
      # don't open a second one.
      - name: Check for an existing guard issue for this sha
        if: steps.pr-check.outputs.pr_count == '0'
        id: dedupe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          existing=$(gh issue list --repo "$REPO" --label main-push-guard --state all --search "$SHA in:body" --json number --jq 'length')
          echo "Existing main-push-guard issues mentioning $SHA: $existing"
          echo "existing=$existing" >> "$GITHUB_OUTPUT"

      # `gh issue create --label` fails if the label doesn't exist yet
      # (gh does not auto-create labels) — this repo has no reason to
      # have a "main-push-guard" label before this workflow's first
      # real trigger. Make sure it exists so the issue-create step
      # below doesn't fail on a fresh repo. Idempotent: swallow the
      # "already exists" error on every subsequent run.
      - name: Ensure the main-push-guard label exists
        if: steps.pr-check.outputs.pr_count == '0' && steps.dedupe.outputs.existing == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create main-push-guard \
            --repo "$REPO" \
            --color B60205 \
            --description "Direct push to main detected (bypassed the PR flow)" \
            2>/dev/null || true

      - name: Open issue — direct push to main detected
        if: steps.pr-check.outputs.pr_count == '0' && steps.dedupe.outputs.existing == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_EMAIL: ${{ github.event.head_commit.author.email }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          set -e
          cat > /tmp/main-push-guard-issue.md <<BODY
          A commit landed on \`main\` without an associated pull request.

          - **SHA**: \`$SHA\`
          - **Author**: $COMMIT_AUTHOR <$COMMIT_EMAIL>
          - **Pushed at**: $COMMIT_TIMESTAMP
          - **Message**:

          \`\`\`
          $COMMIT_MESSAGE
          \`\`\`

          This repo has no server-side branch protection — private repo on the
          GitHub Free plan, which requires Pro/Team/Enterprise for that on
          private repos. The expected flow is: open a PR, then
          \`gh pr merge --squash\`. \`.githooks/pre-push\` should have blocked
          a direct push to \`main\` locally; this issue means it was bypassed
          with \`--no-verify\`, the pusher's git never had the hook wired up
          (no \`npm install\` run), or the push came from something other than
          a local git client.

          \`main\` auto-deploys to production — whatever is in this commit is
          already live.
          BODY
          gh issue create \
            --repo "$REPO" \
            --title "Direct push to main detected: $SHA" \
            --label "main-push-guard" \
            --body-file /tmp/main-push-guard-issue.md
